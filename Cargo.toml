[package]
name = "restate-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Async stale-while-revalidate cache with single-flight and composable storage tiers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ulrichheringer/restate-cache"

[features]
default = []
redis = ["dep:redis", "dep:serde_json"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
redis = { version = "0.29", optional = true, features = ["tokio-comp", "connection-manager"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
